name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    # dsp-core and effect-lib on x86-64. GCC builds the effect core only; Clang also builds
    # libsoundpower.so and its AELI tests (the AOSP headers need Clang in C++).
    name: host (${{ matrix.toolchain.name }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
        preset: [host-debug, host-release, host-asan]
        include:
          - toolchain: { name: gcc, cc: gcc, cxx: g++ }
            preset: host-tsan
          - toolchain: { name: clang, cc: clang, cxx: clang++ }
            preset: host-tsan
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      PRESET: ${{ matrix.preset }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja (and the Clang sanitizer runtimes)
        run: |
          packages="ninja-build zip unzip"
          if [ "$CC" = clang ]; then
            packages="$packages libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends $packages

      - name: Reduce ASLR entropy for ThreadSanitizer
        if: matrix.preset == 'host-tsan'
        # TSan cannot map its shadow memory with the runner kernel's default mmap_rnd_bits.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset "$PRESET" -DSP_WERROR=ON

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel

      - name: Test
        run: ctest --preset "$PRESET" --parallel 4

      - name: Benchmark (informational)
        if: matrix.preset == 'host-release'
        run: |
          {
            echo "### dsp-core benchmark (${{ matrix.toolchain.name }}, x86-64 runner)"
            echo '```'
            "build/$PRESET/dsp-core/bench/sp-bench" --seconds 2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: fuzz (libFuzzer, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja and the Clang runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"

      - name: Configure
        run: cmake --preset host-fuzz -DSP_WERROR=ON

      - name: Build
        run: cmake --build --preset host-fuzz --parallel

      - name: Test (includes a fixed-seed fuzz smoke run)
        run: ctest --preset host-fuzz --parallel 4

      - name: Fuzz the effect command interface
        run: |
          mkdir -p corpus
          build/host-fuzz/effect-lib/fuzz/sp_effect_fuzz -max_total_time=120 \
            -artifact_prefix=crash- corpus

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  android-ndk:
    # Cross-builds for the device ABIs. The tests need a device (ctest runs them over adb), so CI
    # only runs the ELF check: exports, NEEDED libraries and 16 KB page alignment.
    name: android-ndk (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, preset: android-arm64 }
          - { abi: armeabi-v7a, preset: android-armv7 }
    env:
      NDK_VERSION: 28.2.13676358
      PRESET: ${{ matrix.preset }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja and NDK r28
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset "$PRESET" -DSP_WERROR=ON

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel

      - name: Check the ELF
        run: ctest --preset "$PRESET" -R sp_effect_elf_check

      - name: Upload libsoundpower.so
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsoundpower-${{ matrix.abi }}
          path: build/${{ matrix.preset }}/effect-lib/libsoundpower.so
          if-no-files-found: error

  magisk-module:
    # Lints the module scripts and builds the installable zip (both ABIs, stripped).
    name: magisk-module
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the shell scripts
        run: |
          shellcheck --version
          shellcheck -s sh -S warning \
            magisk-module/template/*.sh \
            magisk-module/template/META-INF/com/google/android/update-binary \
            magisk-module/build.sh magisk-module/tests/test_scripts.sh scripts/*.sh

      - name: Install Ninja, zip and NDK r28
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build zip unzip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build the module zip
        run: magisk-module/build.sh

      - name: Upload the module zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soundpower-magisk-module
          path: out/soundpower-module-*.zip
          if-no-files-found: error

  app:
    # JVM tests of the Kotlin modules, lint, and the APKs. The app bundles the module zip built
    # by the job above. On pushes the release APK is signed with the key in the repository
    # secrets (SP_KEYSTORE_BASE64, SP_KEYSTORE_PASSWORD, SP_KEY_ALIAS, SP_KEY_PASSWORD).
    name: app
    needs: magisk-module
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the module zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soundpower-magisk-module
          path: out

      - name: Use JDK 21 and install Android 37.2
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2" > /dev/null

      - name: Set up release signing
        if: github.event_name == 'push'
        env:
          SP_KEYSTORE_BASE64: ${{ secrets.SP_KEYSTORE_BASE64 }}
          SP_KEYSTORE_PASSWORD: ${{ secrets.SP_KEYSTORE_PASSWORD }}
          SP_KEY_ALIAS: ${{ secrets.SP_KEY_ALIAS }}
          SP_KEY_PASSWORD: ${{ secrets.SP_KEY_PASSWORD }}
        run: |
          if [ -z "$SP_KEYSTORE_BASE64" ]; then
            echo "::warning::The signing secrets are not set; the release APK stays unsigned."
            exit 0
          fi
          printf '%s' "$SP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # A properties file: the passwords must not contain backslashes.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SP_KEYSTORE_PASSWORD"
            echo "keyAlias=$SP_KEY_ALIAS"
            echo "keyPassword=$SP_KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "SP_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Test, lint and build
        run: ./gradlew --no-daemon test lintDebug assembleDebug assembleRelease

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soundpower-app
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    # Publishes the signed APK and the module zip on the repository's Releases page: each push to
    # main replaces the "nightly" pre-release, and a v<VERSION> tag makes a versioned release.
    # The asset names stay the same, so the download links in the README never change.
    name: release
    # Only after every check passed.
    needs: [host, fuzz, android-ndk, app]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soundpower-app
          path: dist/app

      - name: Get the module zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soundpower-magisk-module
          path: dist/module

      - name: Publish
        run: |
          version=$(cat VERSION)
          apk=dist/app/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::warning::No signed release APK (are the signing secrets set?); nothing published."
            exit 0
          fi
          mkdir upload
          cp "$apk" upload/soundpower.apk
          cp "dist/module/soundpower-module-v$version.zip" upload/soundpower-magisk-module.zip
          (cd upload && sha256sum -- * > SHA256SUMS)

          # Verifies the signature before publishing, with the JDK the build used (apksigner runs
          # the `java` on PATH).
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          if ! certs=$("$apksigner" verify --print-certs upload/soundpower.apk); then
            echo "::error::$apksigner could not verify soundpower.apk; nothing published."
            exit 1
          fi
          echo "$apksigner $("$apksigner" version):"
          printf '%s\n' "$certs"
          # "Signer #1 certificate ..." (build tools 36) or "V2 Signer: certificate ..." (37).
          cert=$(printf '%s\n' "$certs" | sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' | head -n 1)
          [ -n "$cert" ] || echo "::warning::No certificate digest in the apksigner output."
          {
            echo "Built from ${GITHUB_SHA:0:7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "- \`soundpower.apk\`: the app, for root and no-root use. With root it installs the module itself."
            echo "- \`soundpower-magisk-module.zip\`: the same module, to flash from the Magisk app."
            if [ -n "$cert" ]; then
              echo
              echo "Signing certificate SHA-256: \`$cert\`"
            fi
          } > notes.md

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)."
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" upload/* --verify-tag \
              --title "SoundPower $version" --notes-file notes.md --generate-notes
          else
            # Moves the nightly tag to this commit by recreating the pre-release.
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            {
              echo "Development build of the main branch: new features, not yet validated."
              echo
              cat notes.md
            } > nightly.md
            gh release create nightly upload/* --prerelease --target "$GITHUB_SHA" \
              --title "SoundPower $version (development build)" --notes-file nightly.md
          fi
